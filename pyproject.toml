[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxplotlibx"
version = "0.2.0"
description = "A reproducible plotting module with various backends and export options."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["matplotlib"]
authors = [{name = "Max"}]
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "matplotlib",
    "pint",
    "plotly",
    "plotext >= 6.0, < 7",
    "tikzfigure[vis]>=0.4.0",
]
[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
    "xarray",
]
xarray = [
    "xarray",
]
docs = [
    "xarray",
    "griffe",
    "ipykernel",
    "nbclient>=0.11",
    "nbformat>=5.11.1",
]
dev = [
    "maxplotlibx[test,docs]",
    "ruff",
    "jupyterlab",
    "nbstripout",
    "pre-commit",
    "pyproject-fmt",
]
[project.urls]
"Source" = "https://github.com/max-models/maxplotlib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
# formatting: `ruff format`; import sorting: the isort rules of `ruff check`
# an explicit rule set: ruff's default one grows between releases
lint.select = ["E4", "E7", "E9", "F", "I"]
