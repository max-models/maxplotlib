name: Testing

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python-version: ['3.12']
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      # - name: Set up Python
      #   uses: actions/setup-python@v4
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install LaTeX
        run: |
          # pdflatex with pgfplots: the tikzfigure backend, its tests and tutorials
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended lmodern

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          # tikzfigure 0.4.0 is not on PyPI yet: install it from GitHub (drop once released)
          pip install "tikzfigure[vis] @ git+https://github.com/max-models/tikzfigure@c290f43ac1deb4a4ed3b5b40919f10d3a6b53e8b"
          pip install ".[dev]"

      - name: Run tests
        run: |
          coverage run -m pytest .
          coverage report --sort=cover
      
      - name: Test tutorials
        run: |
          jupyter nbconvert --to notebook --execute tutorials/*.ipynb \
            --output-dir=/tmp --ExecutePreprocessor.timeout=300
