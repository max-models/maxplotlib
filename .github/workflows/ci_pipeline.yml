name: Testing

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python-version: ['3.12']
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      # - name: Set up Python
      #   uses: actions/setup-python@v4
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          # tikzfigure 0.4.0 is not on PyPI yet: install it from GitHub (drop once released)
          pip install "tikzfigure[vis] @ git+https://github.com/max-models/tikzfigure@c290f43ac1deb4a4ed3b5b40919f10d3a6b53e8b"
          pip install ".[dev]"

      - name: Run tests
        run: |
          coverage run -m pytest .
          coverage report --sort=cover
      
      - name: Test tutorials
        run: |
          # tutorial_07_tikz.ipynb requires pdflatex — skip it in CI
          jupyter nbconvert --to notebook --execute \
            $(ls tutorials/*.ipynb | grep -v tutorial_07_tikz) \
            --output-dir=/tmp --ExecutePreprocessor.timeout=300
