name: Matplotlib import compatibility

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  import-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        matplotlib: ['3.8.*', '3.9.*', '3.10.*', '3.11.*']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # tikzfigure 0.4.0 is not on PyPI yet: install it from GitHub (drop once released)
      - run: python -m pip install "tikzfigure[vis] @ git+https://github.com/max-models/tikzfigure@c290f43ac1deb4a4ed3b5b40919f10d3a6b53e8b"
      - run: python -m pip install '.[test]' 'numpy<2' 'matplotlib==${{ matrix.matplotlib }}'
      - run: python -m pytest src/maxplotlib/tests/test_matplotlib_import.py src/maxplotlib/tests/test_matplotlib_import_extended.py
